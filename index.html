<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="decoration left-hand">✊</div>
  <div class="decoration right-hand">✋</div>
  <div class="decoration bottom-hand">✌️</div>

  <div class="game-container">

    <div class="crown">👑</div>

    <h1>Rock Paper Scissors</h1>
    <p class="subtitle">Choose your move and challenge the computer!</p>
    <p id="match-status">🏆 Best of 5 Championship</p>

    <div class="choices">

      <button class="choice-btn" data-choice="rock">
        <span class="hand">✊</span>
        <span>Rock</span>
      </button>

      <button class="choice-btn" data-choice="paper">
        <span class="hand">✋</span>
        <span>Paper</span>
      </button>

      <button class="choice-btn" data-choice="scissors">
        <span class="hand">✌️</span>
        <span>Scissors</span>
      </button>

    </div>

    <div class="result">
      <p id="player-choice">Your choice: -</p>
      <p id="computer-choice">Computer's choice: -</p>
      <h2 id="result-message">Make your move!</h2>
    </div>

    <div class="score-board">

      <div class="score-card player-card">
        <h3>You</h3>
        <p id="player-score">0</p>
      </div>

      <div class="trophy">🏆</div>

      <div class="score-card computer-card">
        <h3>Computer</h3>
        <p id="computer-score">0</p>
      </div>

    </div>

    <button id="reset-btn">🔄 Reset Game</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
